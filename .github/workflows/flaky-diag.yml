# TEMPORARY (#85): reproduce the Windows/macOS test flakes with Qt's messages visible.
name: Flaky diag

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        exp: [waitcrash, natural]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Find cdb
        shell: bash
        run: |
          ls "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" || find /c/Program\ Files* -iname cdb.exe 2>/dev/null | head
      - name: Experiment ${{ matrix.exp }} under cdb
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .github/diag
          EXP: ${{ matrix.exp }}
        run: |
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          case "$EXP" in
            waitcrash) python .github/diag/edit.py gc_genuine_noworker ;;
            natural) ;;
          esac
          PY=$(python -c "import sys; print(sys.executable)")
          fails=0
          for i in $(seq 1 8); do
            printf '.lines -d\n.echo ==== STACKS\n~*kn 60\n.echo ==== EXC\n.exr -1\n.ecxr\nkn 60\nq\n' | \
              "$CDB" -g -G -o "$PY" -X faulthandler=0 -m pytest -q -s -p no:faulthandler -p no:cacheprovider -p diagplug > out.txt 2>&1 || true
            if grep -q ' passed' out.txt && ! grep -q '==== STACKS' out.txt; then
              echo "run $i: ok ($(grep ' passed' out.txt | tail -1))"
            else
              fails=$((fails+1))
              echo "::group::run $i FAILED"
              grep -v -E '^ModLoad|^This plugin' out.txt | tail -250
              echo "::endgroup::"
              [ $fails -ge 2 ] && break
            fi
          done
          echo "failed runs: $fails"
          test $fails -eq 0
