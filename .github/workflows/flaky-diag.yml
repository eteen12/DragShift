# TEMPORARY (#85): reproduce the Windows/macOS test flakes with Qt's messages visible.
name: Flaky diag

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        exp: [gc_patched_noworker, gc_patched_worker, gc_genuine_worker, garbage]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Experiment ${{ matrix.exp }}, suite in a loop, no capture
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          PYTHONPATH: .github/diag
          EXP: ${{ matrix.exp }}
        run: |
          args=""
          case "$EXP" in
            *) python .github/diag/edit.py "$EXP" ;;
          esac
          fails=0
          for i in $(seq 1 20); do
            if python -m pytest -q -s -p no:cacheprovider -p diagplug $args > out.txt 2>&1; then
              echo "run $i: ok ($(tail -1 out.txt))"; grep "\[diag\] garbage" out.txt | head -1 | cut -c1-3000
            else
              fails=$((fails+1))
              echo "::group::run $i FAILED"
              grep -v -E '^\s*File ".*(_pytest|pluggy)' out.txt | tail -60
              echo "::endgroup::"
            fi
          done
          echo "failed runs: $fails"
          test $fails -eq 0
