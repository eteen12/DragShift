# TEMPORARY (#85): reproduce the Windows/macOS test flakes with Qt's messages visible.
name: Flaky diag

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        exp: [collectable, all, wording, logging, linux, core]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Experiment ${{ matrix.exp }}, suite in a loop, no capture
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          PYTHONPATH: .github/diag
          EXP: ${{ matrix.exp }}
        run: |
          args=""
          T=tests/test_result_actions.py
          case "$EXP" in
            collectable) python .github/diag/edit.py collectable ;;
            all) python .github/diag/edit.py gc_genuine_noworker ;;
            wording) python .github/diag/edit.py gc_genuine_noworker; args="tests/test_linux_wording.py $T" ;;
            logging) python .github/diag/edit.py gc_genuine_noworker; args="tests/test_logging.py $T" ;;
            linux) python .github/diag/edit.py gc_genuine_noworker; args="tests/test_linux.py $T" ;;
            core) python .github/diag/edit.py gc_genuine_noworker; args="tests/test_core.py tests/test_formats.py tests/test_linux_autostart.py $T" ;;
          esac
          fails=0
          for i in $(seq 1 6); do
            if python -m pytest -q -s -p no:cacheprovider -p diagplug $args > out.txt 2>&1; then
              echo "run $i: ok ($(tail -1 out.txt))"
            else
              fails=$((fails+1))
              echo "::group::run $i FAILED"
              grep -v -E '^\s*File ".*(_pytest|pluggy)|gc: collectable' out.txt | tail -40
              grep -o 'gc: collectable <[A-Za-z0-9_.]*' out.txt | sort | uniq -c | sort -rn | head -80 || true
              echo "::endgroup::"
            fi
            if [ "$EXP" = collectable ] && [ $i = 1 ]; then
              grep -o 'gc: collectable <[A-Za-z0-9_.]*' out.txt | sort | uniq -c | sort -rn | head -80 || true
            fi
          done
          echo "failed runs: $fails"
          test $fails -eq 0
