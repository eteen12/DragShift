# TEMPORARY (#85): reproduce the Windows/macOS test flakes with Qt's messages visible.
name: Flaky diag

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Suite in a loop, no capture
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          fails=0
          for i in $(seq 1 ${LOOPS:-15}); do
            if python -m pytest -q -s -p no:cacheprovider > out.txt 2>&1; then
              echo "run $i: ok ($(tail -1 out.txt))"
            else
              fails=$((fails+1))
              echo "::group::run $i FAILED (exit $?)"
              grep -v -E '^This plugin does not support|^\s*File ".*(_pytest|pluggy)' out.txt | tail -120
              echo "::endgroup::"
            fi
          done
          echo "failed runs: $fails"
          test $fails -eq 0
